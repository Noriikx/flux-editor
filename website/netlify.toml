[build]
  publish = "."
  functions = "netlify/functions"
  # Only deploy when something in the website folder changed (app-only pushes are skipped,
  # so they don't use up the free plan's monthly deploys).
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- ."

# old pages from when Premium was sold
[[redirects]]
  from = "/thanks.html"
  to = "/"
  status = 301
  force = true

[[redirects]]
  from = "/site.html"
  to = "/"
  status = 301
  force = true
