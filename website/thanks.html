<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thank you - Flux Premium</title>
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=Figtree:wght@400;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
  :root { --ink: #09080f; --panel: #12111b; --line: #2a2738; --text: #eeedf7; --muted: #9a97b0; --lav: #c3bfff; --mint: #57d9a3; --grad: linear-gradient(120deg, #e8ebff, #a79eff 48%, #6c4bff); color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: radial-gradient(ellipse 70% 60% at 50% 0%, rgba(108,75,255,.25), transparent 70%), var(--ink); color: var(--text); font: 16px/1.6 "Figtree", "Segoe UI", sans-serif; padding: 24px 16px; }
  .card { width: 100%; max-width: 560px; background: var(--panel); border: 1px solid var(--line); border-radius: 20px; padding: 34px; text-align: center; }
  img { width: 64px; height: 64px; border-radius: 16px; }
  h1 { font: 800 32px "Bricolage Grotesque", sans-serif; margin: 16px 0 6px; letter-spacing: -.02em; }
  p { color: var(--muted); margin: 0 0 18px; }
  .key { font: 500 13px "JetBrains Mono", Consolas, monospace; word-break: break-all; background: #0c0b13; border: 1px dashed #4b4570; border-radius: 12px; padding: 14px; color: var(--lav); text-align: left; user-select: all; }
  button { margin-top: 14px; border: none; border-radius: 12px; padding: 13px 22px; font: 700 15px "Figtree", sans-serif; background: var(--grad); color: #120d2c; cursor: pointer; }
  ol { text-align: left; color: var(--muted); margin: 22px 0 0; padding-left: 20px; }
  ol b { color: var(--text); }
  .err { color: #ff8a9b; }
</style>
</head>
<body>
  <main class="card">
    <img src="logo.png" alt="">
    <h1 id="title">Getting your key…</h1>
    <p id="msg">One moment while we confirm your payment.</p>
    <div id="out" hidden>
      <div class="key" id="key"></div>
      <button id="copy">Copy key</button>
      <ol>
        <li>Open <b>Flux</b> and click <b>Premium</b> at the top.</li>
        <li>Paste the key and click <b>Activate</b>.</li>
        <li>Bookmark this page - you can come back to it if you need the key again.</li>
      </ol>
    </div>
  </main>
<script>
  const id = new URLSearchParams(location.search).get('session_id');
  const title = document.getElementById('title'), msg = document.getElementById('msg');
  async function load() {
    if (!id) { title.textContent = 'No purchase found'; msg.innerHTML = '<span class="err">This page needs the link from your Stripe checkout.</span>'; return; }
    try {
      const r = await fetch('/.netlify/functions/license?session_id=' + encodeURIComponent(id));
      const j = await r.json();
      if (!r.ok) throw new Error(j.error || 'Something went wrong.');
      title.textContent = 'Thank you!';
      msg.textContent = 'Here is your Flux Premium key' + (j.email ? ' for ' + j.email : '') + '.';
      document.getElementById('key').textContent = j.key;
      document.getElementById('out').hidden = false;
    } catch (e) {
      title.textContent = 'Almost there';
      msg.innerHTML = '<span class="err"></span>';
      msg.firstChild.textContent = e.message + ' If this keeps happening, contact us with your Stripe receipt.';
    }
  }
  document.getElementById('copy').onclick = async (e) => {
    const k = document.getElementById('key').textContent;
    try { await navigator.clipboard.writeText(k); e.target.textContent = 'Copied!'; } catch { getSelection().selectAllChildren(document.getElementById('key')); }
  };
  load();
</script>
</body>
</html>
