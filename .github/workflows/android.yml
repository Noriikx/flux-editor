# Builds the Flux Android app (mobile/) in GitHub's cloud and puts it on the "Flux for Android" release.
name: Build Android app
on:
  push:
    branches: [main]
    paths: ['mobile/**', 'website/lite/**', 'website/fonts/**', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build the app
        working-directory: mobile
        env:
          FLUX_KEYSTORE: ${{ github.workspace }}/mobile/keys/flux-release.jks
          FLUX_KEY_PASS: flux-android-release
        run: |
          sh copy-web.sh
          gradle assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk Flux-Android.apk
          ls -la Flux-Android.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: android
          name: Flux for Android
          body: The Flux app for Android phones. Download Flux-Android.apk on your phone, open it and tap Install.
          prerelease: true
          make_latest: false
          files: mobile/Flux-Android.apk
