# Builds Flux for Windows and Mac and attaches the installers to your GitHub Release.
name: Build Flux installers
on:
  release:
    types: [published]
permissions:
  contents: write
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            args: --win
          - os: macos-latest
            args: --mac
          - os: macos-13
            args: --mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npx electron-builder ${{ matrix.args }} --publish never
      # quick updates: just Flux's own code (app.asar) + what it needs to match, so updating doesn't reinstall
      - name: Quick-update files (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          cp dist/win-unpacked/resources/app.asar dist/Flux-app.asar
          node -e "const fs=require('fs'),r='dist/win-unpacked/resources/app.asar.unpacked/node_modules/';const v=(n)=>{try{return JSON.parse(fs.readFileSync(r+n+'/package.json','utf8')).version}catch{return null}};fs.writeFileSync('dist/Flux-app.json',JSON.stringify({version:require('./package.json').version,electronMajor:require('electron/package.json').version.split('.')[0],unpacked:Object.fromEntries(['ffmpeg-static','onnxruntime-node','@huggingface/transformers','sharp'].map(n=>[n,v(n)]))}))"
          cat dist/Flux-app.json
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: |
            dist/*.exe
            dist/*.dmg
            dist/Flux-app.asar
            dist/Flux-app.json
